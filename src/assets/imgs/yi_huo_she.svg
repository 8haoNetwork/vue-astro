<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 翼火蛇 - 简化版 -->
  <g transform="translate(50, 50)">
    <!-- 主要连线 -->
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="-15" y2="-15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-25" x2="15" y2="-15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="-20" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-15" x2="20" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="-15" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="15" x2="15" y2="25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- 星点 -->
    <circle cx="0" cy="-30" r="4" fill="#ffffff"/>
    <circle cx="0" cy="30" r="4" fill="#ffffff"/>
    <circle cx="-15" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="15" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="-20" cy="0" r="3" fill="#ffffff"/>
    <circle cx="20" cy="0" r="3" fill="#ffffff"/>
    <circle cx="-15" cy="25" r="3" fill="#ffffff"/>
    <circle cx="15" cy="25" r="3" fill="#ffffff"/>
  </g>
</svg>