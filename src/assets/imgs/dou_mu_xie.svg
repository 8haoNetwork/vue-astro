<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 斗木獬 - 简化版 -->
  <g transform="translate(50, 50)">
    <!-- 主要连线 -->
    <line x1="-20" y1="-15" x2="-5" y2="-25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-25" x2="5" y2="-25" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-25" x2="20" y2="-15" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="-5" y1="-25" x2="-10" y2="-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="5" y1="-25" x2="10" y2="-5" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- 星点 -->
    <circle cx="-20" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="-5" cy="-25" r="4" fill="#ffffff"/>
    <circle cx="5" cy="-25" r="4" fill="#ffffff"/>
    <circle cx="20" cy="-15" r="3" fill="#ffffff"/>
    <circle cx="-10" cy="-5" r="3" fill="#ffffff"/>
    <circle cx="10" cy="-5" r="3" fill="#ffffff"/>
  </g>
</svg>