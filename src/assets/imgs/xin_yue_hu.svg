<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- 心月狐 - 简化版 -->
  <g transform="translate(50, 50)">
    <!-- 主要连线 -->
    <line x1="-20" y1="0" x2="0" y2="-20" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="-20" x2="20" y2="0" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- 星点 -->
    <circle cx="-20" cy="0" r="4" fill="#ffffff"/>
    <circle cx="0" cy="-20" r="5" fill="#ff6b6b"/>
    <circle cx="20" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>